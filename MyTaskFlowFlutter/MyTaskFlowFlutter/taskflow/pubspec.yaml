name: taskflow
description: "TaskFlow — productivity app built with Clean Architecture and TDD."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.0
  hive_flutter: ^1.1.0

  # Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.5.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  mockito: ^5.4.4
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
